name: V2Ray Custom Release

on:
  push:
    branches: [ "v5-result" ] # 只要你往这个分支推代码，就会更新 Release
    paths-ignore:
      #- '.github/workflows/*.yml'  # 忽略工作流文件自身的改动
      - '**.md'                    # 忽略所有 Markdown 文件的改动
  workflow_dispatch: # 👈 加入这一行，允许手动点击运行

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 必须赋予写入 Release 的权限
    strategy:
      fail-fast: false # 关键：即使一个平台失败，其他平台也继续编译，不要中断
      matrix:
        include:
          # --- Windows ---
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64  # 适用于 Surface Pro X 等

          # --- Linux (服务器) ---
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64

          # --- Android (手机终端) ---
          - goos: android
            goarch: arm64  # 这是你最需要的，用于 data/local/tmp 运行

          # --- macOS ---
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64  # M1/M2/M3 芯片

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.4'
          cache: true

      - name: Build V2Ray Core
        run: |
          mkdir -p build_assets
          # 定义输出名称
          NAME=v5-result
          SUFFIX=""
          if [ "${{ matrix.goos }}" = "windows" ]; then SUFFIX=".exe"; fi
          
          # 核心编译逻辑：-ldflags "-s -w" 减小体积
          # 编译路径必须指向 ./main
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
          go build -v -ldflags "-s -w" -tags "conf_json" -o build_assets/$NAME-${{ matrix.goos }}-${{ matrix.goarch }}$SUFFIX ./main

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: custom-build # 固定的 Tag 名字
          name: "V2Ray 定制版 (CF 优选支持)"          
          draft: false
          prerelease: false
          files: build_assets/*
          append_body: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}